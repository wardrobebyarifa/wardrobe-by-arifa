name: Deploy Wardrobe by Arifa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build website
        run: |
          base64 --decode storefront/site.html.gz.b64 | gzip --decompress > index.html
          test -f images/hero-bridal-original.jpg
          test "$(wc -c < images/hero-bridal-original.jpg)" -gt 100000
          test -f product-images/mandarin/dusty-rose.jpg
          test -f product-images/chiffon/peach-blossom.jpg
          test -f product-images/irish/ivory.jpg
          grep -q 'PKR 12,500' index.html
          grep -q 'product-images/mandarin/dusty-rose.jpg' index.html
          grep -q 'product-images/chiffon/peach-blossom.jpg' index.html
          grep -q 'product-images/irish/ivory.jpg' index.html
          grep -q 'images/hero-bridal-original.jpg' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
