name: Generate clean product crops

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-product-crops.yml'
      - 'images/**'

permissions:
  contents: write

jobs:
  crop:
    if: github.event.head_commit.message != 'Generate clean product crops'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Crop brochure model panels
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          items = [
            ('mandarin','dusty-rose','images/ChatGPT Image Aug 10, 2026, 07_01_23 PM (3).png',0.55),
            ('mandarin','electric-blue','images/ChatGPT Image Aug 10, 2026, 07_01_23 PM (4).png',0.55),
            ('mandarin','hot-pink','images/ChatGPT Image Aug 10, 2026, 07_01_23 PM (5).png',0.55),
            ('mandarin','maroon','images/ChatGPT Image Aug 10, 2026, 07_01_24 PM (6).png',0.55),
            ('mandarin','mocha-taupe','images/ChatGPT Image Aug 10, 2026, 07_01_24 PM (7).png',0.55),
            ('mandarin','charcoal-noir','images/ChatGPT Image Aug 10, 2026, 07_01_24 PM (8).png',0.55),
            ('mandarin','white','images/ChatGPT Image Aug 10, 2026, 07_02_40 PM (1).png',0.55),
            ('mandarin','sage-mist','images/ChatGPT Image Aug 10, 2026, 07_02_40 PM (2).png',0.55),
            ('chiffon','peach-blossom','images/09686ad3-552f-4e26-bcc5-72fc97b8a3d5.png',0.48),
            ('chiffon','lilac-dew','images/6cd6bcf9-59b2-4e8b-896d-2ad3ef039372.png',0.48),
            ('chiffon','seafoam-glow','images/7eeb7246-46f0-4640-8105-5934810ef1e6.png',0.48),
            ('chiffon','powder-sky','images/967c479d-c79a-4beb-8247-f0541b2a9c87.png',0.48),
            ('chiffon','mint-breeze','images/a09bbdd9-d0e5-4801-a61a-241315c441b9.png',0.48),
            ('chiffon','blush-petal','images/c5234bbe-5cc2-437e-b31a-3c01505d76bd.png',0.48),
            ('irish','ivory','images/1.png',0.48),
            ('irish','dusty-blue','images/2.png',0.48),
            ('irish','charcoal','images/4.png',0.48),
            ('irish','soft-lilac','images/5.png',0.48),
            ('irish','terracotta','images/7.png',0.48),
            ('irish','olive','images/8.png',0.48),
          ]
          for collection, slug, src, left_frac in items:
              srcp=Path(src)
              if not srcp.exists():
                  raise SystemExit(f'Missing source: {src}')
              im=Image.open(srcp)
              im=ImageOps.exif_transpose(im).convert('RGB')
              w,h=im.size
              # Keep the model/right-hand fashion panel, excluding brochure copy on the left.
              crop=im.crop((int(w*left_frac), 0, w, h))
              # Keep enough resolution for sharp product cards without oversized files.
              if crop.height > 1500:
                  new_h=1500
                  new_w=round(crop.width*new_h/crop.height)
                  crop=crop.resize((new_w,new_h), Image.Resampling.LANCZOS)
              out=Path('product-images')/collection/f'{slug}.jpg'
              out.parent.mkdir(parents=True, exist_ok=True)
              crop.save(out, 'JPEG', quality=91, optimize=True, progressive=True)
              print(out, crop.size)
          PY

      - name: Commit generated crops
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-images
          if git diff --cached --quiet; then
            echo 'No crop changes to commit.'
          else
            git commit -m 'Generate clean product crops'
            git push
          fi
