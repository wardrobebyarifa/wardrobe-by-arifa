name: Deploy Wardrobe by Arifa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build website
        run: |
          cp storefront/index.html index.html
          sed -i 's#\.\./images/#images/#g' index.html
          test -f images/hero-bridal-original.jpg
          test "$(wc -c < images/hero-bridal-original.jpg)" -gt 100000
          grep -q 'PKR 14,500' index.html
          grep -q 'images/hero-bridal-original.jpg' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
