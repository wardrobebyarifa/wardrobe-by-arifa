name: Deploy Wardrobe by Arifa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare correctly matched collection images
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          items = [
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_41 PM (1).png', 'product-images/chiffon/peach-blossom.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_42 PM (6).png', 'product-images/chiffon/lilac-dew.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_43 PM (8).png', 'product-images/chiffon/seafoam-glow.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_45 PM (10).png', 'product-images/chiffon/powder-sky.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_41 PM (2).png', 'product-images/irish/ivory.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_42 PM (3).png', 'product-images/irish/dusty-blue.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_42 PM (4).png', 'product-images/irish/charcoal.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_42 PM (5).png', 'product-images/irish/soft-lilac.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_43 PM (7).png', 'product-images/irish/terracotta.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_44 PM (9).png', 'product-images/irish/olive.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_50 PM (1).png', 'product-images/mandarin/white.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_50 PM (2).png', 'product-images/mandarin/sage-mist.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_51 PM (3).png', 'product-images/mandarin/dusty-rose.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_51 PM (4).png', 'product-images/mandarin/electric-blue.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_51 PM (5).png', 'product-images/mandarin/hot-pink.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_51 PM (6).png', 'product-images/mandarin/maroon.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_52 PM (7).png', 'product-images/mandarin/mocha-taupe.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_52 PM (8).png', 'product-images/mandarin/charcoal-noir.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_52 PM (9).png', 'product-images/mandarin/white-alt.jpg'),
            ('clean-product-data/ChatGPT Image Aug 12, 2026, 09_26_52 PM (10).png', 'product-images/mandarin/sage-mist-alt.jpg'),
          ]

          for src, dst in items:
              srcp = Path(src)
              if not srcp.exists():
                  raise SystemExit(f'Missing clean source image: {src}')
              out = Path(dst)
              out.parent.mkdir(parents=True, exist_ok=True)
              im = ImageOps.exif_transpose(Image.open(srcp)).convert('RGB')
              if im.width > 1200:
                  new_h = round(im.height * 1200 / im.width)
                  im = im.resize((1200, new_h), Image.Resampling.LANCZOS)
              im.save(out, 'JPEG', quality=92, optimize=True, progressive=True)
          PY

      - name: Reconstruct Azadi sale hero
        run: |
          mkdir -p images
          cat hero-data/azadi-part-00.b64 \
              hero-data/azadi-part-01.b64 \
              hero-data/azadi-part-02.b64 \
              hero-data/azadi-part-03.b64 \
              hero-data/azadi-part-04.b64 \
              hero-data/azadi-part-05.b64 \
              hero-data/azadi-part-06.b64 \
              hero-data/azadi-part-07.b64 \
              | base64 --decode > images/azadi-sale-hero.webp
          test "$(wc -c < images/azadi-sale-hero.webp)" -eq 34824

      - name: Build website and apply display fixes
        run: |
          base64 --decode storefront/site.html.gz.b64 | gzip --decompress > index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          html = html.replace('FOLLOW @WARDROBE.BY.ARIFA', 'FOLLOW @wardrobebyarifa')
          html = html.replace('images/hero-bridal-original.jpg', 'images/azadi-sale-hero.webp')
          html = html.replace('Wardrobe by Arifa fashion portrait', 'Wardrobe by Arifa Azadi Sale')

          patch = '''<style id="display-fixes">
          .category-card img{object-fit:contain!important;object-position:center center!important;padding:8px!important}
          .insta-grid img{object-fit:contain!important;object-position:center center!important;padding:4px!important}
          .insta-grid a{background:#efe6de!important}
          .promo-art{background-size:contain!important;background-position:center center!important;background-repeat:no-repeat!important;background-color:#efe3d8!important}
          .promo .btn{background:#fff!important;color:#342b27!important;border-color:#fff!important;min-width:126px!important}
          .promo .btn:hover{background:#f6eee8!important;color:#342b27!important}

          /* Azadi Sale hero: full campaign artwork, blended into the cream storefront. */
          .hero{
            min-height:0!important;
            height:auto!important;
            padding:0!important;
            background:#f1e2d6!important;
            display:block!important;
            overflow:hidden!important;
          }
          .hero-photo{
            position:relative!important;
            inset:auto!important;
            width:100%!important;
            height:auto!important;
            max-height:none!important;
            object-fit:contain!important;
            object-position:center center!important;
            display:block!important;
            background:#f1e2d6!important;
          }
          .hero-left,.hero-right{display:none!important}

          @media(max-width:780px){
            .promo-art{height:360px!important;background-size:contain!important;background-position:center center!important}
            .hero{min-height:0!important;height:auto!important;padding:0!important}
            .hero-photo{
              position:relative!important;
              inset:auto!important;
              width:100%!important;
              height:auto!important;
              object-fit:contain!important;
              object-position:center center!important;
            }
          }
          </style>'''

          if '</head>' not in html:
              raise SystemExit('Missing </head> in storefront')
          html = html.replace('</head>', patch + '</head>', 1)
          p.write_text(html, encoding='utf-8')
          PY
          test -f images/azadi-sale-hero.webp
          test "$(wc -c < images/azadi-sale-hero.webp)" -eq 34824
          test "$(find clean-product-data -maxdepth 1 -name '*.png' | wc -l)" -eq 20
          grep -q 'PKR 12,500' index.html
          grep -q 'display-fixes' index.html
          grep -q 'images/azadi-sale-hero.webp' index.html
          grep -q 'FOLLOW @wardrobebyarifa' index.html
          grep -q '.hero-left,.hero-right{display:none!important}' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
