name: Deploy Wardrobe by Arifa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build website
        run: |
          cat site-parts/part-*.html > index.html
          mkdir -p images
          cat \
            hero-q25/part01.txt \
            hero-q25/part02.txt \
            hero-q25/part03.txt \
            hero-q25/seg01.txt \
            hero-q25/seg02.txt \
            hero-q25/seg03.txt \
            hero-q25/seg04.txt \
            hero-q25/seg05-1.txt \
            hero-q25/seg05-2.txt \
            hero-q25/seg05-3.txt \
            hero-q25/seg05-4.txt \
            hero-q25/part05.txt \
            | base64 --decode > images/bridal-hero.webp
          test "$(wc -c < images/bridal-hero.webp)" -eq 42152
          grep -q 'images/bridal-hero.webp' index.html
          rm -rf hero-q25

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
