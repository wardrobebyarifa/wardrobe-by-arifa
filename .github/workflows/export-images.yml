name: Export uploaded product images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Package uploaded images
        run: |
          mkdir -p review-batch/images
          find images -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -size +100k -print0 | xargs -0 -I{} cp "{}" review-batch/images/
          printf 'Files: '; find review-batch/images -type f | wc -l
      - name: Upload review batch
        uses: actions/upload-artifact@v4
        with:
          name: product-image-review-batch
          path: review-batch
          retention-days: 1
